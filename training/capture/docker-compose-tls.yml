# Isolated Zeek instance for TLS training-data capture. Unlike the
# ddos/recon/c2 captures (which target loopback -- this project's simulated
# data-diode link), real HTTPS traffic to real internet domains doesn't
# traverse `lo`, so this one watches the actual egress interface instead.
# Still a separate container/log directory from the live demo's
# zeek_monitor, so training captures never touch the production pipeline.
#
# `name:` set explicitly -- shares a directory with docker-compose.yml; see
# that file's comment for the real incident this prevents.
name: ntro-training-capture-external
services:
  zeek_ml_capture_tls:
    image: zeek/zeek:latest
    container_name: zeek_ml_capture_tls
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./zeek-tls/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
      - ../../zeek/scripts:/usr/local/zeek/share/zeek/site/scripts:ro
      - ../zeek-logs-tls:/usr/local/zeek/logs/current
    working_dir: /usr/local/zeek/logs/current
    command: >
      zeek -i wlp3s0
      /usr/local/zeek/share/zeek/site/local.zeek
