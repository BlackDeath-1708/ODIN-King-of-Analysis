# Isolated Zeek instance for ML training-data capture. Deliberately a
# DIFFERENT container (zeek_ml_capture) from the live demo's zeek_monitor,
# so bulk training captures never pollute the production dashboard's
# Kafka/alert pipeline. See ../README.md for the full capture methodology.
#
# `name:` set explicitly -- this file and docker-compose-tls.yml share a
# directory, so without an explicit project name Compose infers the SAME
# default name for both (directory-based). A real incident this session:
# tearing down docker-compose-tls.yml while this container was separately
# running silently killed this one too (logged as an "orphan container"
# warning at the time, wrongly dismissed as harmless) -- lost ~70 minutes
# of a real capture run. Explicit distinct names prevent this class of bug.
name: ntro-training-capture-loopback
services:
  zeek_ml_capture:
    image: zeek/zeek:latest
    container_name: zeek_ml_capture
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
      - ../zeek-logs:/usr/local/zeek/logs/current
    working_dir: /usr/local/zeek/logs/current
    command: >
      zeek -C -i lo
      /usr/local/zeek/share/zeek/site/local.zeek
